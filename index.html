
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo Studio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #243b65);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #cbd5e1;
        }

        button {
            background: #38bdf8;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #7dd3fc;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Fluxo Studio</h1>
        <p>Meu primeiro site publicado no GitHub Pages!</p>
        <button onclick="alert('Site funcionando perfeitamente!')">
            Testar site
        </button>
    </div>
</body>
</html>
